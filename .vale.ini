StylesPath = styles

Packages = https://github.com/tbhb/vale-ai-tells/releases/download/v1.11.0/ai-tells.zip, https://github.com/tbhb/vale-ai-tells/releases/download/v1.11.0/ai-tells-commits.zip, Google, write-good, alex

Vocab = Backpressure

[*.md]
BasedOnStyles = ai-tells, Google, write-good, alex
write-good.E-Prime = NO

# Prose policy: docs/references/prose-gate.md.
# Existing plans and investigations are evidence records, not current product docs.
# Keep the full Personal dev-tooling profile on READMEs, CLAUDE.md, ADRs, and package docs.
[{docs/exec-plans,docs/investigations}/**/*.md]
BasedOnStyles = ai-tells, Google, write-good, alex
write-good.E-Prime = NO
# Rationale: Historical plans and investigations preserve research notes, quoted evidence, terse labels, and technical planning terms. These local exceptions keep the baseline gate from rewriting evidence while the default profile remains active everywhere else.
ai-tells.EmDashUsage = NO
ai-tells.FormalRegister = NO
ai-tells.FormalTransitions = NO
ai-tells.OverusedVocabulary = NO
ai-tells.VerbTricolon = NO
ai-tells.Metacommentary = NO
ai-tells.EmphaticCopula = NO
ai-tells.ContrastiveFormulas = NO
ai-tells.MicDrop = NO
Google.EmDash = NO
Google.Latin = NO
Google.LyHyphens = NO
Google.DateFormat = NO
Google.Units = NO
Google.Ordinal = NO
alex.Condescending = NO
write-good.ThereIs = NO
write-good.So = NO

[COMMIT_EDITMSG]
BasedOnStyles = ai-tells, ai-tells-commits

[formats]
COMMIT_EDITMSG = md
